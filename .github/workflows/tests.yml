name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's machines already have Google Chrome; using it avoids downloading browser packages (which failed when Ubuntu's servers were down)
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/*.log
            tests/shots/
